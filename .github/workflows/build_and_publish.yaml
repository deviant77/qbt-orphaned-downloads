name: build and publish

on:
  push:
    branches:
      - trunktest
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Docker Hub meta
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}
        id: docker_meta_dockerhub
        uses: crazy-max/ghaction-docker-meta@v1
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.repository }}
          tag-semver: |
            {{version}}
            {{major}}
            {{major}}.{{minor}}

      - name: Generate GHCR meta
        id: docker_meta_ghcr
        uses: crazy-max/ghaction-docker-meta@v1
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tag-semver: |
            {{version}}
            {{major}}
            {{major}}.{{minor}}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and push Docker Hub image
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ steps.docker_meta_dockerhub.outputs.tags }}
          labels: ${{ steps.docker_meta_dockerhub.outputs.labels }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ steps.docker_meta_ghcr.outputs.tags }}
          labels: ${{ steps.docker_meta_ghcr.outputs.labels }}

      - name: Extract release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: ffurrer2/extract-release-notes@v1

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
